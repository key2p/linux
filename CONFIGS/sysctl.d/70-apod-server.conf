# APOD server tuning defaults (installed by apod-sysctl deb)
# Sources: Cloudflare production blogs (2022/2018), veLinux official sysctl list
# (ByteDance), Alibaba Cloud Linux 3 official optimizations, RHEL9 tuned
# (redhat-performance/tuned, verified against the el9_8 package), openEuler A-Tune.
# NOTE: this kernel baseline is newer than pre-5.4 guides: somaxconn=4096,
# rmem_max/wmem_max=4MB, TCP buffers scale with RAM. Do not copy old recipes.

# -- queues / concurrency --
# Cloudflare production value / veLinux (kernel baseline 4096)
net.core.somaxconn = 16384
# veLinux (kernel baseline 1000)
net.core.netdev_max_backlog = 16384
# veLinux (kernel baseline cap 4096)
net.ipv4.tcp_max_syn_backlog = 16384

# -- socket buffer ceilings --
# veLinux / openEuler / RHEL recipes (kernel baseline 4MB; headroom for UDP setsockopt)
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216

# -- TCP behavior --
# RHEL tuned / Alibaba Cloud Linux 3 / veLinux consensus (baseline 1)
net.ipv4.tcp_slow_start_after_idle = 0
# Cloudflare web production / RHEL tuned (baseline unlimited)
net.ipv4.tcp_notsent_lowat = 131072
# RHEL network-latency / veLinux (baseline client-only = 1)
net.ipv4.tcp_fastopen = 3
# Alibaba Cloud Linux 3 / veLinux fast-fail (baseline 5)
net.ipv4.tcp_synack_retries = 2
# Alibaba Cloud Linux 3 (baseline 6)
net.ipv4.tcp_syn_retries = 4
# Alibaba Cloud Linux 3: total retrans ~102s instead of ~15min (gateway fast-fail).
# Override with a 90-*.conf on hosts that rely on long lossy transfers.
net.ipv4.tcp_retries2 = 8
# veLinux (outbound-heavy gateway)
net.ipv4.ip_local_port_range = 10000 65535

# -- VM --
# RHEL tuned consensus (baseline 60)
vm.swappiness = 10

# ---- optional: enable per deployment ----
# net.ipv4.tcp_collapse_max_bytes = 6291456
#   (collapse-skip is enabled in-kernel by default now; reference only)
# net.core.busy_read = 50
# net.core.busy_poll = 50
#   (latency profile: trade CPU for lower socket-read latency)
# net.ipv4.tcp_keepalive_time = 1800
# net.ipv4.tcp_keepalive_intvl = 30
# net.ipv4.tcp_keepalive_probes = 3
#   (Tencent Cloud official server recommendation; baseline 7200/75/9)
# net.ipv4.tcp_adv_win_scale = -2
#   (Cloudflare big-BDP set; intercontinental throughput targets + RAM headroom only)
